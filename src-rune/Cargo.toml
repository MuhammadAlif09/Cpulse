[package]
name = "cpulse-rune"
version = "0.16.14"
description = "CPulse — Pure-Rust GPU-Rendered Windows System Monitor, Performance Booster & Junk Cleaner powered by Rune (Zero WebView2)"
authors = ["Muhammad Alif"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "cpulse-rune"
path = "src/main.rs"

[dependencies]
# Official anomalyco/rune Pure-Rust GPU UI Framework & Ecosystem (Zero msedgewebview2.exe)
rune = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "59e7c017b968fdcfe289b6bdfc6eaffc09388b11" }

# Core Windows System & Telemetry Dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sysinfo = "0.36.1"
is_elevated = "0.1.2"
trash = "5.2.3"
winreg = "0.56.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }
windows = { version = "0.61", features = ["Win32_UI_Shell"] }

[profile.dev]
incremental = false
debug = "line-tables-only"
strip = "debuginfo"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
